# =============================================================================
# Stage E — Pretraining Configuration
# =============================================================================
# Run on the HOST machine (pure PyTorch, no Isaac Sim).
#   python pretrain_dynamics.py
# =============================================================================

# ── Data ─────────────────────────────────────────────────────────────────────
data_dir: /home/hanyu/wangyuhan/HIROLRobotPlatform/dependencies/isaaclab/data

# ── Training ─────────────────────────────────────────────────────────────────
epochs: 300
batch_size: 32
lr: 1.0e-4
weight_decay: 1.0e-4
num_workers: 8
seed: 42
device: cuda

# ── Loss weights ─────────────────────────────────────────────────────────────
w_dyn: 1.0
w_task: 15.0
w_eng: 10.0
w_recon: 1.0       # masked latent reconstruction (MAE-style)

# ── Warmup ───────────────────────────────────────────────────────────────────
warmup_inv_cons: 5

# ── Force noise ──────────────────────────────────────────────────────────────
# sigma_start: 0.0
# sigma_end: 2.0
# sigma_start_epoch: 10
# sigma_end_epoch: 80

# ── Model ────────────────────────────────────────────────────────────────────
# backbone: dinov2_vits14
backbone: dinov2_vits14_attn
pretrained_backbone: true
freeze_backbone: true
mono: false

# ── Output ───────────────────────────────────────────────────────────────────
output_dir: ../../output/pretrain
early_stop_patience: 15
