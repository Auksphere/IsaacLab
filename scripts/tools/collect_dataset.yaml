# =============================================================================
# Stage D — Unified Dataset Collection Configuration
# =============================================================================
# All paths are container-side.  This file is mounted under
#   /workspace/isaaclab/scripts/tools/collect_dataset.yaml
# via the scripts/ bind mount.
# =============================================================================

# ── Task ─────────────────────────────────────────────────────────────────────
# Overridable via --task CLI arg
task: Isaac-Factory-PegInsert-Encoder-Direct-v0

# ── Output ──────────────────────────────────────────────────────────────────
# Splits are placed directly under this directory:
#   <output_dir>/train/   <output_dir>/val/   <output_dir>/test/
output_dir: /workspace/hirol/dependencies/isaaclab/data

# ── Checkpoint ──────────────────────────────────────────────────────────────
checkpoint: /workspace/isaaclab/logs/rl_games/Factory/sanity_check/nn/last_Factory_ep_200_rew_389.05432.pth

# ── Collection ──────────────────────────────────────────────────────────────
num_envs: 1           # >1 is buggy (factory_env._reset_idx partial-reset issue)
max_steps_per_ep: 200
min_success_steps: 15  # consecutive success frames to stop early
camera_resolution: 224  # 112 = 4x faster rendering
action_noise: 1.20      # Gaussian noise σ on expert actions (0 = pure expert)

# ── Splits ──────────────────────────────────────────────────────────────────
# Each split collects <episodes> episodes with its own seed and DR preset.
splits:
  - name: train
    episodes: 240
    seed: 42
    domain_rand: strong
  - name: val
    episodes: 30
    seed: 123
    domain_rand: mild
  - name: test
    episodes: 30
    seed: 456
    domain_rand: none

# ── Domain Randomization Presets ────────────────────────────────────────────
# Each preset maps to fields on DomainRandCfg.  An empty preset means no
# randomization (all fields stay at their default [0,0] / [1,1] ranges).
domain_randomization:
  none: {}

  mild:
    dome_light_intensity: [0.5, 1.5]
    camera_pos_noise: [0.00, 0.00, 0.00]
    held_mass_scale: [0.95, 1.05]
    held_friction: [0.9, 1.1]

  strong:
    # lighting
    dome_light_intensity: [0.5, 1.5]
    key_light_intensity: [0.8, 1.2]
    # camera
    camera_pos_noise: [0.00, 0.00, 0.00]
    camera_target_noise: [0.00, 0.00, 0.00]
    # physics
    held_mass_scale: [0.7, 1.3]
    held_friction: [0.5, 1.5]
    joint_damping_scale: [0.7, 1.3]
    peg_scale: [0.97, 1.03]
    # visual materials
    peg_hue_shift: [0, 360]
    peg_saturation: [0.5, 1.5]
    peg_value: [0.5, 1.5]
    table_roughness: [0.2, 0.9]
    table_metallic: [0.0, 0.4]
    table_color_shift: [0.5, 0.5, 0.5]
    floor_hue_shift: [0, 360]
    fixture_hue_shift: [0, 360]
